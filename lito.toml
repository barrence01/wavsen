[package]
name = "wavsen"
version = "0.1.0"

[lib]
name = "wavsen"
module = "wavsen"
archive = "wavsen"
sources = [
  "src/lib.cppm",
  "src/decode/mod.cppm",
  "src/decode/mod.cpp",
  "src/video/mod.cppm",
  "src/video/presenter.cppm",
  "src/video/video_decoder.cppm",
  "src/video/video_decoder.cpp",
  "src/video/vk_device.cppm",
  "src/video/vk_device.cpp",
  "src/video/yuv_to_rgba.cppm",
  "src/video/yuv_to_rgba.cpp",
  "src/audio/av_sync.cppm",
  "src/audio/av_sync.cpp",
  "src/audio/byte_stream.cppm",
  "src/audio/capture.cppm",
  "src/audio/capture_window.cppm",
  "src/audio/core.cppm",
  "src/audio/file.cppm",
  "src/audio/file.cpp",
  "src/audio/gain.cppm",
  "src/audio/mixer.cppm",
  "src/audio/mixer.cpp",
  "src/audio/mod.cppm",
  "src/audio/mod.cpp",
  "src/ffi/ffmpeg/avcodec.cppm",
  "src/ffi/ffmpeg/avformat.cppm",
  "src/ffi/ffmpeg/avutil.cppm",
  "src/ffi/ffmpeg/mod.cppm",
  "src/ffi/ffmpeg/swresample.cppm",
  "src/ffi/ffmpeg/swscale.cppm",
]
when = [
  { condition = 'target.os == "macos"', source-groups = ["macos-audio-capture"] },
  { condition = 'target.os != "macos"', source-groups = ["portable-audio-capture"] },
]

[[when]]
condition = 'target.os != "macos"'

[when.usage]
public-definitions = ["WAVSEN_HAS_VAAPI=1"]

[dependencies.rstd-core]
version = "0.1.0"
pub = true

[dependencies.rstd-std]
version = "0.1.0"
pub = true

[dependencies.rstd-cppstd]
version = "0.1.0"
pub = true

[dependencies.rstd-log]
version = "0.1.0"

[dependencies.rstd-dlopn]
version = "0.1.0"

[dependencies.vvk]
git = "https://github.com/litocpp/vvk.git"
pub = true

[external-dependencies.pkg-config.libavformat]
module = "libavformat"
version = ">= 58"
pub = true

[external-dependencies.pkg-config.libavcodec]
module = "libavcodec"
version = ">= 58"
pub = true

[external-dependencies.pkg-config.libavutil]
module = "libavutil"
version = ">= 56"
pub = true

[external-dependencies.pkg-config.libswscale]
module = "libswscale"
version = ">= 5"
pub = true

[external-dependencies.pkg-config.libswresample]
module = "libswresample"
version = ">= 3"
pub = true

[external-dependencies.pkg-config.libva]
module = "libva"
pub = true
condition = 'target.os != "macos"'

[external-dependencies.pkg-config.libva-drm]
module = "libva-drm"
pub = true
condition = 'target.os != "macos"'

[external-dependencies.pkg-config.libpulse]
module = "libpulse"
version = ">= 14.0"
usage = "compile"
condition = 'target.os != "macos"'

[external-sources.wavsen-shader]
path = "shaders"

[external-dependencies.cmake.wavsen-shader]
package = "WavsenShader"
source = "wavsen-shader"
targets = [{ name = "WavsenShader::nv12_to_rgba" }]

[source-groups.portable-audio-capture]
sources = ["src/audio/capture.cpp"]

[source-groups.macos-audio-capture]
sources = ["src/audio/audio_capture_coreaudio.cpp"]

[external-sources.wavsen-apple-audio]
path = "src/audio"

[external-dependencies.cmake.wavsen-apple-audio]
package = "WavsenAppleAudio"
source = "wavsen-apple-audio"
condition = 'target.os == "macos"'
targets = [{ name = "WavsenAppleAudio::capture" }]

[external-sources.wavsen-apple-bridge]
path = "src/video"

[external-dependencies.cmake.wavsen-apple-bridge]
package = "WavsenAppleBridge"
source = "wavsen-apple-bridge"
condition = 'target.os == "macos"'
targets = [{ name = "WavsenAppleBridge::bridge" }]
