[package]
name = "wavsen"
version = "0.1.0"
authors = ["hypengw <hypengwip@gmail.com>"]
license = "MIT OR Apache-2.0"

[lib]
name = "wavsen"
module = "wavsen"
archive = "wavsen"
when = [
  { condition = 'target.os == "macos"', source-groups = ["apple-native"] },
]

[[when]]
condition = 'target.os != "macos"'

[when.usage]
public-definitions = ["WAVSEN_HAS_VAAPI=1"]

[dependencies]
rstd-core = { version = "0.1.0", pub = true }
rstd-std = { version = "0.1.0", pub = true }
rstd-cppstd = { version = "0.1.0", pub = true }
rstd-log = "0.1.0"
rstd-dlopn = "0.1.0"
vvk = { git = "https://github.com/litocpp/vvk.git", pub = true }

[external-dependencies.pkg-config]
libavformat = { module = "libavformat", version = ">= 58", pub = true }
libavcodec = { module = "libavcodec", version = ">= 58", pub = true }
libavutil = { module = "libavutil", version = ">= 56", pub = true }
libswscale = { module = "libswscale", version = ">= 5", pub = true }
libswresample = { module = "libswresample", version = ">= 3", pub = true }
libva = { module = "libva", pub = true, condition = 'target.os != "macos"' }
libva-drm = { module = "libva-drm", pub = true, condition = 'target.os != "macos"' }
libpulse = { module = "libpulse", version = ">= 14.0", usage = "compile", condition = 'target.os != "macos"' }

[build-tools.glslang]
path = "glslangValidator"

[source-groups.apple-native]
sources = [
  "src/video/apple/metal.mm",
  "src/audio/backend/coreaudio/process_tap.mm",
]

[[when]]
condition = 'target.os == "macos"'

[when.usage]
frameworks = ["CoreAudio", "AudioToolbox", "CoreFoundation", "Foundation", "CoreVideo", "IOSurface", "Metal"]

[[test]]
name = "audio-capture-window"
sources = ["tests/audio_capture_window_tests.cpp"]

[[test]]
name = "audio-gain"
sources = ["tests/audio_gain_tests.cpp"]

[[test]]
name = "audio-backend"
sources = ["tests/audio_backend_tests.cpp"]
